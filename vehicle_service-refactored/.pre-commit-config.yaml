repos:
  - repo: https://github.com/OCA/maintainer-tools
    rev: v4.1.0
    hooks:
      - id: oca-checks-odoo-module
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        name: flake8
        args: ['--max-line-length=120']
